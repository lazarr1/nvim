# ============================================
# TMUX Configuration
# ============================================

# Change prefix from Ctrl-b to Ctrl-a (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ============================================
# Window Switching (prefix + number)
# ============================================
# Windows are 1-indexed for ergonomic number row access
set -g base-index 1
setw -g pane-base-index 1

# Quick window switching: Alt + number (no prefix needed)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ============================================
# Pane Splitting (easier keys)
# ============================================
# Split horizontally with | and vertically with -
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# ============================================
# Pane Navigation (vim-style + arrows)
# ============================================
# Use Alt + arrow keys without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vim-style pane navigation with prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ============================================
# Pane Resizing
# ============================================
# Resize with prefix + Shift + arrow (fine control)
bind -r S-Left resize-pane -L 2
bind -r S-Right resize-pane -R 2
bind -r S-Up resize-pane -U 2
bind -r S-Down resize-pane -D 2

# Resize with prefix + H/J/K/L (larger increments)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick resize with Ctrl+Alt+arrows (no prefix, instant)
bind -n C-M-Left resize-pane -L 3
bind -n C-M-Right resize-pane -R 3
bind -n C-M-Up resize-pane -U 3
bind -n C-M-Down resize-pane -D 3

# ============================================
# Layout Presets (quick tiling)
# ============================================
# prefix + Space cycles through preset layouts
# Additional quick layouts:
bind = select-layout even-horizontal
bind + select-layout even-vertical
bind t select-layout tiled
bind T select-layout main-vertical

# ============================================
# Pane/Window Management
# ============================================
# Kill pane quickly (no confirmation)
bind x kill-pane
bind X kill-window

# Alt+x to kill pane without prefix
bind -n M-x kill-pane

# Alt+n to create new window without prefix
bind -n M-n new-window -c "#{pane_current_path}"

# ============================================
# Scrolling / Copy Mode
# ============================================
# Use vi keys in copy mode (hjkl to navigate, / to search)
setw -g mode-keys vi

# Enter copy/scroll mode with prefix + [ or just PageUp
bind [ copy-mode
bind -n PageUp copy-mode -u

# Mouse wheel scroll enters copy mode automatically
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# In copy mode: v to start selection, y to yank
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Scroll up/down with prefix + k/j (half page)
bind -T copy-mode-vi C-u send -X halfpage-up
bind -T copy-mode-vi C-d send -X halfpage-down

# ============================================
# Quality of Life
# ============================================
# Enable mouse support (resize panes, select windows, scroll)
set -g mouse on

# Faster key repetition
set -sg escape-time 0
set -g repeat-time 300

# Increase scrollback buffer
set -g history-limit 50000

# Renumber windows when one is closed
set -g renumber-windows on

# New windows/panes open in current directory
bind c new-window -c "#{pane_current_path}"

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ============================================
# Visual / Status Bar
# ============================================
# Enable 256 colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Status bar styling
set -g status-position bottom
set -g status-style 'bg=#333333 fg=#ffffff'
set -g status-left ' [#S] '
set -g status-right ' %H:%M %d-%b '
set -g status-left-length 20

# Highlight active window
setw -g window-status-current-style 'fg=#000000 bg=#ffffff bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-format ' #I:#W '

# Pane border colors
set -g pane-border-style 'fg=#555555'
set -g pane-active-border-style 'fg=#00ff00'
